services:
  # Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: tredmail-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tredmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tredmail_prod_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - tredmail_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Ingestion Queues
  redis:
    image: redis:7-alpine
    container_name: tredmail-redis-prod
    restart: always
    volumes:
      - redis_data_prod:/data
    networks:
      - tredmail_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TredMail API Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tredmail-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tredmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tredmail_prod_db}?schema=public
      REDIS_URL: redis://redis:6379
      TREDMAIL_MASTER_ENCRYPTION_KEY: ${TREDMAIL_MASTER_ENCRYPTION_KEY:?set TREDMAIL_MASTER_ENCRYPTION_KEY in .env}
      API_BASE_URL: https://${API_DOMAIN:-api.tredmail.dovepeak.com}/v1
      TRACKING_BASE_URL: https://${TRACKING_DOMAIN:-track.tredmail.dovepeak.com}/v1/track
      CONSOLE_URL: https://${CONSOLE_DOMAIN:-console.tredmail.dovepeak.com}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      TRUST_PROXY: "true"
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-tredmail.dovepeak.com}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN:-track.tredmail.dovepeak.com}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.tredmail.dovepeak.com}
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: "false"
    networks:
      - tredmail_network

  # TredMail Email Delivery Worker (Processes BullMQ queue & signs DKIM)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/worker/dist/index.js"]
    container_name: tredmail-worker-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tredmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tredmail_prod_db}?schema=public
      REDIS_URL: redis://redis:6379
      TREDMAIL_MASTER_ENCRYPTION_KEY: ${TREDMAIL_MASTER_ENCRYPTION_KEY:?set TREDMAIL_MASTER_ENCRYPTION_KEY in .env}
      # Links embedded in emails must use public URLs, never localhost
      API_BASE_URL: https://${API_DOMAIN:-api.tredmail.dovepeak.com}/v1
      TRACKING_BASE_URL: https://${TRACKING_DOMAIN:-track.tredmail.dovepeak.com}/v1/track
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: "false"
    networks:
      - tredmail_network

  # Caddy Reverse Proxy (Automatic Let's Encrypt SSL & Routing)
  caddy:
    image: caddy:2-alpine
    container_name: tredmail-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tredmail_network
    depends_on:
      - api

volumes:
  postgres_data_prod:
  redis_data_prod:
  caddy_data:
  caddy_config:

networks:
  tredmail_network:
    driver: bridge
