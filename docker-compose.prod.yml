# TredMail production and staging stack.
#
#   Production: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   Staging:    docker compose -f docker-compose.prod.yml --env-file .env.staging \
#                 --profile staging-relay up -d --build
#
# Production adds `--profile mta`, which starts KumoMTA (the delivery engine, port 25); the
# worker hands mail to it on the internal port 2525. Staging runs the same images with
# SMTP_HOST=mailpit, so every email is captured instead of delivered, and never binds port 25.
# deploy-hostinger.sh picks the right profile. Container names come from the compose project
# (-p), so stacks do not collide.

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-tredmail}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tredmail}?schema=public
  REDIS_URL: redis://redis:6379
  TREDMAIL_MASTER_ENCRYPTION_KEY: ${TREDMAIL_MASTER_ENCRYPTION_KEY:?set TREDMAIL_MASTER_ENCRYPTION_KEY}
  # Links embedded in emails must use public URLs, never localhost
  API_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN}/v1
  TRACKING_BASE_URL: https://${TRACKING_DOMAIN:?set TRACKING_DOMAIN}/v1/track
  CONSOLE_URL: https://${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN}
  PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-tredmail.dovepeakdigital.com}
  TRACKING_DOMAIN: ${TRACKING_DOMAIN}
  BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.tredmail.dovepeakdigital.com}
  # kumomta:2525 in production, mailpit:1025 in staging
  SMTP_HOST: ${SMTP_HOST:-kumomta}
  SMTP_PORT: ${SMTP_PORT:-2525}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MTA_HOSTNAME: ${MTA_HOSTNAME:-mta1.tredmail.dovepeakdigital.com}
  # Alerts and forwarded postmaster@/abuse@/dmarc@ mail go here
  OPS_EMAIL: ${OPS_EMAIL:-}
  # First day of IP warm-up (YYYY-MM-DD); leave empty once warm-up is over
  MTA_WARMUP_START: ${MTA_WARMUP_START:-}
  # Optional backup provider for mail above the warm-up cap
  FALLBACK_SMTP_HOST: ${FALLBACK_SMTP_HOST:-}
  FALLBACK_SMTP_PORT: ${FALLBACK_SMTP_PORT:-587}
  FALLBACK_SMTP_SECURE: ${FALLBACK_SMTP_SECURE:-false}
  FALLBACK_SMTP_USER: ${FALLBACK_SMTP_USER:-}
  FALLBACK_SMTP_PASS: ${FALLBACK_SMTP_PASS:-}
  EMAIL_CONTENT_RETENTION_DAYS: ${EMAIL_CONTENT_RETENTION_DAYS:-30}
  EMAIL_RECORD_RETENTION_DAYS: ${EMAIL_RECORD_RETENTION_DAYS:-395}
  # Staging only: addresses (or @domains) that are delivered for real instead of to Mailpit
  STAGING_DELIVERY_ALLOWLIST: ${STAGING_DELIVERY_ALLOWLIST:-}
  STAGING_DELIVERY_SMTP_HOST: ${STAGING_DELIVERY_SMTP_HOST:-}
  SMTP_RELAY_HOSTNAME: ${SMTP_RELAY_HOSTNAME:-smtp.tredmail.dovepeakdigital.com}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tredmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tredmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile }
    image: tredmail-backend:${TREDMAIL_VERSION:-latest}
    restart: always
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *backend-env
      PORT: 3000
      TRUST_PROXY: "true"
      CORS_ORIGINS: https://${CONSOLE_DOMAIN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SANDBOX_DAILY_LIMIT: ${SANDBOX_DAILY_LIMIT:-50}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: tredmail-backend:${TREDMAIL_VERSION:-latest}
    command: ["node", "apps/worker/dist/index.js"]
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *backend-env

  console:
    build:
      context: apps/console
      args:
        NEXT_PUBLIC_GOOGLE_SIGN_IN: ${GOOGLE_SIGN_IN_ENABLED:-false}
        CONSOLE_URL: https://${CONSOLE_DOMAIN}
    restart: always
    depends_on:
      api: { condition: service_healthy }

  # Delivery engine. Port 25 is public (bounces, complaints, postmaster@ mail); the worker
  # injects on 2525, which is reachable only inside this Docker network.
  kumomta:
    image: ghcr.io/kumocorp/kumomta:2026.09.29-b90d8bc1
    profiles: ["mta"]
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      TREDMAIL_API_URL: http://api:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      MTA_HOSTNAME: ${MTA_HOSTNAME:-mta1.tredmail.dovepeakdigital.com}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-tredmail.dovepeakdigital.com}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.tredmail.dovepeakdigital.com}
      MTA_RELAY_NETWORKS: ${MTA_RELAY_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    ports:
      - "25:25"
    volumes:
      - ./mta/policy:/opt/kumomta/etc/policy:ro
      - kumomta_spool:/var/spool/kumomta
      - kumomta_logs:/var/log/kumomta
      # Let's Encrypt certificate for STARTTLS, copied from Caddy by scripts/cert-sync.sh
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/2525"]
      interval: 15s
      timeout: 5s
      retries: 6

  # SMTP relay for applications that send through SMTP: port 587 (STARTTLS) and 465 (TLS),
  # username anything, password an API key. Production only, like KumoMTA.
  smtp-relay:
    image: tredmail-backend:${TREDMAIL_VERSION:-latest}
    command: ["node", "apps/smtp-relay/dist/index.js"]
    profiles: ["mta"]
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *backend-env
      SMTP_RELAY_PORT: 587
      SMTP_RELAY_TLS_PORT: 465
      SMTP_RELAY_TLS_CERT: /certs/smtp.crt
      SMTP_RELAY_TLS_KEY: /certs/smtp.key
    ports:
      - "587:587"
      - "465:465"
    volumes:
      - ./certs:/certs:ro

  # Staging only, with --profile staging-delivery: a private KumoMTA (no public port) that
  # delivers mail for STAGING_DELIVERY_ALLOWLIST to real inboxes. Set
  # STAGING_DELIVERY_SMTP_HOST=kumomta-staging in .env.staging to use it.
  kumomta-staging:
    image: ghcr.io/kumocorp/kumomta:2026.09.29-b90d8bc1
    profiles: ["staging-delivery"]
    restart: always
    depends_on:
      api: { condition: service_healthy }
    environment:
      TREDMAIL_API_URL: http://api:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      MTA_HOSTNAME: ${MTA_HOSTNAME:-mta1.tredmail.dovepeakdigital.com}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-tredmail.dovepeakdigital.com}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.tredmail.dovepeakdigital.com}
      MTA_RELAY_NETWORKS: ${MTA_RELAY_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    volumes:
      - ./mta/policy:/opt/kumomta/etc/policy:ro
      - kumomta_staging_spool:/var/spool/kumomta

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      TRACKING_DOMAIN: ${TRACKING_DOMAIN}
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-tredmail.dovepeakdigital.com}
      BOUNCE_DOMAIN: ${BOUNCE_DOMAIN:-bounces.tredmail.dovepeakdigital.com}
      MTA_HOSTNAME: ${MTA_HOSTNAME:-mta1.tredmail.dovepeakdigital.com}
      SMTP_RELAY_HOSTNAME: ${SMTP_RELAY_HOSTNAME:-smtp.tredmail.dovepeakdigital.com}
      # testing | enforce (see docs/PRODUCTION_INFRASTRUCTURE.md)
      MTA_STS_MODE: ${MTA_STS_MODE:-testing}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - console

  # Staging only: catches every outbound email. Its web UI is not published; reach it with
  # an SSH tunnel: ssh -L 8025:<mailpit container IP>:8025 or `docker compose port`.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["staging-relay"]
    restart: always
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  kumomta_staging_spool:
  kumomta_spool:
  kumomta_logs:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
