[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tredmail"
version = "1.3.0"
description = "Python SDK for TredMail, the transactional email API by Dovepeak Technologies"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dovepeak Technologies" }]
license = { text = "Proprietary" }
dependencies = []

[project.urls]
Documentation = "https://console.tredmail.dovepeakdigital.com/docs"

[tool.setuptools]
packages = ["tredmail"]
